<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8D7" />
      <stop offset="100%" stop-color="#F6CEB4" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Soft Lavender Gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#C4B5FD" stroke-width="4"/>

  <!-- Ambient AI Floating Nodes & Data Constellations -->
  <g opacity="0.6">
    <circle cx="60" cy="110" r="5" fill="#8B5CF6"/>
    <circle cx="110" cy="70" r="3" fill="#A855F7"/>
    <line x1="60" y1="110" x2="110" y2="70" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <circle cx="330" cy="95" r="4" fill="#8B5CF6"/>
    <circle cx="360" cy="140" r="6" fill="#A855F7"/>
    <line x1="330" y1="95" x2="360" y2="140" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <circle cx="50" cy="260" r="4" fill="#7C3AED"/>
    <circle cx="90" cy="300" r="5" fill="#A855F7"/>
    <line x1="50" y1="260" x2="90" y2="300" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Subtle Binary / Tech Symbols -->
    <text x="320" y="270" font-family="monospace" font-size="12" fill="#8B5CF6" opacity="0.7">01</text>
    <text x="350" y="295" font-family="monospace" font-size="12" fill="#8B5CF6" opacity="0.7">10</text>
    <path d="M 335 240 L 345 230 L 355 240" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Person Base - Torso / Blouse -->
  <path d="M 120 380 Q 140 285 200 285 Q 260 285 280 380 Z" fill="url(#primaryGrad)"/>
  <path d="M 175 285 L 200 325 L 225 285 Z" fill="#DDD6FE" opacity="0.9"/>
  <path d="M 190 325 L 200 375 L 210 325 Z" fill="#7C3AED"/>

  <!-- Neck -->
  <rect x="186" y="240" width="28" height="50" rx="12" fill="url(#skinGrad)"/>

  <!-- Hair Back Layer -->
  <path d="M 140 180 Q 130 270 170 300 Q 200 310 230 300 Q 270 270 260 180 Z" fill="url(#hairGrad)"/>

  <!-- Face -->
  <ellipse cx="200" cy="210" rx="46" ry="52" fill="url(#skinGrad)"/>

  <!-- Hair Front Style -->
  <path d="M 148 185 Q 160 130 200 130 Q 240 130 252 185 Q 230 155 200 160 Q 170 155 148 185 Z" fill="url(#hairGrad)"/>
  <path d="M 148 185 Q 142 235 155 270 Q 150 220 162 195 Z" fill="url(#hairGrad)"/>
  <path d="M 252 185 Q 258 235 245 270 Q 250 220 238 195 Z" fill="url(#hairGrad)"/>

  <!-- Eyes & Eyebrows -->
  <path d="M 175 196 Q 185 192 193 196" stroke="#312E81" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 207 196 Q 215 192 225 196" stroke="#312E81" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <ellipse cx="184" cy="206" rx="4.5" ry="5" fill="#312E81"/>
  <circle cx="186" cy="204" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="216" cy="206" rx="4.5" ry="5" fill="#312E81"/>
  <circle cx="218" cy="204" r="1.5" fill="#FFFFFF"/>

  <!-- Cheerful Smile -->
  <path d="M 191 232 Q 200 242 209 232" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Modern Tech / AI Glasses (Lavender Accents) -->
  <rect x="170" y="197" width="26" height="18" rx="5" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <rect x="204" y="197" width="26" height="18" rx="5" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="196" y1="205" x2="204" y2="205" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="156" y1="202" x2="170" y2="202" stroke="#7C3AED" stroke-width="2"/>
  <line x1="230" y1="202" x2="244" y2="202" stroke="#7C3AED" stroke-width="2"/>

  <!-- Sparkles of Innovation -->
  <g fill="#A855F7">
    <path d="M 275 130 Q 280 135 285 130 Q 280 125 275 130 Z"/>
    <path d="M 115 145 Q 120 150 125 145 Q 120 140 115 145 Z"/>
    <path d="M 290 200 Q 295 208 300 200 Q 295 192 290 200 Z" fill="#7C3AED"/>
  </g>

  <!-- Laptop / Code Base Hint in Front -->
  <path d="M 140 375 L 260 375 L 245 395 L 155 395 Z" fill="#DDD6FE" stroke="#A78BFA" stroke-width="1.5"/>
  <circle cx="200" cy="385" r="3" fill="#7C3AED"/>
</svg>
