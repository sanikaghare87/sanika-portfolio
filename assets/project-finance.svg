<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="finCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="360" rx="16" fill="url(#finBg)"/>

  <!-- Decorative Background Grid Lines -->
  <g stroke="#E9D5FF" stroke-width="1" opacity="0.6">
    <line x1="40" y1="60" x2="560" y2="60"/>
    <line x1="40" y1="120" x2="560" y2="120"/>
    <line x1="40" y1="180" x2="560" y2="180"/>
    <line x1="40" y1="240" x2="560" y2="240"/>
    <line x1="40" y1="300" x2="560" y2="300"/>
  </g>

  <!-- Main Financial Dashboard Card -->
  <rect x="70" y="50" width="460" height="260" rx="20" fill="url(#finCardGrad)" stroke="#DDD6FE" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Top Header of the simulated card -->
  <circle cx="100" cy="80" r="6" fill="#F87171"/>
  <circle cx="120" cy="80" r="6" fill="#FBBF24"/>
  <circle cx="140" cy="80" r="6" fill="#34D399"/>
  <rect x="180" y="74" width="140" height="12" rx="6" fill="#EDE9FE"/>

  <!-- AI Gemini Badge Pill -->
  <rect x="400" y="70" width="105" height="22" rx="11" fill="url(#accentPurple)"/>
  <text x="452" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">✦ Gemini AI</text>

  <!-- Mini Stat Cards -->
  <rect x="100" y="105" width="115" height="55" rx="12" fill="#FAF5FF" stroke="#E9D5FF"/>
  <text x="115" y="125" font-family="sans-serif" font-size="10" fill="#6B7280" font-weight="500">Savings Target</text>
  <text x="115" y="147" font-family="sans-serif" font-size="16" fill="#581C87" font-weight="700">₹85,400</text>

  <rect x="230" y="105" width="115" height="55" rx="12" fill="#FAF5FF" stroke="#E9D5FF"/>
  <text x="245" y="125" font-family="sans-serif" font-size="10" fill="#6B7280" font-weight="500">Monthly Budget</text>
  <text x="245" y="147" font-family="sans-serif" font-size="16" fill="#15803D" font-weight="700">82% on Track</text>

  <rect x="360" y="105" width="145" height="55" rx="12" fill="#FAF5FF" stroke="#E9D5FF"/>
  <text x="375" y="125" font-family="sans-serif" font-size="10" fill="#6B7280" font-weight="500">AI Advisor Insight</text>
  <text x="375" y="145" font-family="sans-serif" font-size="11" fill="#7C3AED" font-weight="600">Smart Alert: Optimize 12%</text>

  <!-- Interactive Chart Area -->
  <rect x="100" y="175" width="405" height="115" rx="12" fill="#FFFFFF" stroke="#F3E8FF"/>

  <!-- Chart Area fill -->
  <path d="M 120 265 L 170 230 L 220 240 L 280 205 L 340 220 L 410 195 L 480 185 L 480 265 Z" fill="url(#chartGrad)"/>
  <!-- Chart Line -->
  <path d="M 120 265 L 170 230 L 220 240 L 280 205 L 340 220 L 410 195 L 480 185" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chart Dots -->
  <circle cx="170" cy="230" r="4.5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="280" cy="205" r="4.5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="410" cy="195" r="4.5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="480" cy="185" r="5.5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Floating AI Chat Bubble -->
  <g filter="url(#cardShadow)">
    <rect x="330" y="240" width="200" height="55" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <circle cx="355" cy="268" r="14" fill="#EDE9FE"/>
    <text x="355" y="273" font-size="14" text-anchor="middle">💡</text>
    <text x="380" y="262" font-family="sans-serif" font-size="10" font-weight="700" fill="#4C1D95">AI Financial Advisor</text>
    <text x="380" y="278" font-family="sans-serif" font-size="9" fill="#6B7280">"Great job! Expense reduced by 8%"</text>
  </g>
</svg>
