<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nexaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="50%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="nexaCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="nexaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#nexaBg)"/>

  <!-- Healthcare Grid / Radial Network Rings -->
  <circle cx="300" cy="180" r="140" fill="none" stroke="#DDD6FE" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <circle cx="300" cy="180" r="90" fill="none" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Main Platform Hub Card -->
  <rect x="80" y="55" width="440" height="250" rx="20" fill="url(#nexaCardGrad)" stroke="#DDD6FE" stroke-width="2" filter="url(#nexaShadow)"/>

  <!-- Top Status Pill -->
  <rect x="220" y="75" width="160" height="26" rx="13" fill="#EDE9FE" stroke="#C4B5FD"/>
  <circle cx="235" cy="88" r="4.5" fill="#10B981"/>
  <text x="295" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6D28D9" text-anchor="middle">NexaCare Network Online</text>

  <!-- 3 Interconnected Pillars: Patients, Doctors, Hospitals -->
  <!-- Left Node: Patients -->
  <g transform="translate(130, 160)">
    <circle cx="0" cy="0" r="32" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2.5" filter="url(#nexaShadow)"/>
    <circle cx="0" cy="-6" r="10" fill="#7C3AED"/>
    <path d="M -16 16 Q -16 6 0 6 Q 16 6 16 16 Z" fill="#7C3AED"/>
    <text x="0" y="48" font-family="sans-serif" font-size="11" font-weight="700" fill="#4C1D95" text-anchor="middle">Patients</text>
  </g>

  <!-- Center Node: AI Coordination Hub -->
  <g transform="translate(300, 160)">
    <circle cx="0" cy="0" r="42" fill="#7C3AED" filter="url(#nexaShadow)"/>
    <!-- Medical AI Cross -->
    <rect x="-7" y="-22" width="14" height="44" rx="4" fill="#FFFFFF"/>
    <rect x="-22" y="-7" width="44" height="14" rx="4" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="7" fill="#A855F7"/>
    <text x="0" y="60" font-family="sans-serif" font-size="12" font-weight="800" fill="#5B21B6" text-anchor="middle">AI Coordination</text>
  </g>

  <!-- Right Node: Doctors & Hospitals -->
  <g transform="translate(470, 160)">
    <circle cx="0" cy="0" r="32" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2.5" filter="url(#nexaShadow)"/>
    <!-- Stethoscope / Hospital Symbol -->
    <path d="M -12 -12 L -12 4 C -12 12, 12 12, 12 4 L 12 -12" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="5" fill="#7C3AED"/>
    <text x="0" y="48" font-family="sans-serif" font-size="11" font-weight="700" fill="#4C1D95" text-anchor="middle">Doctors / Hospitals</text>
  </g>

  <!-- Animated Flow Lines Connecting Them -->
  <line x1="162" y1="160" x2="258" y2="160" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="342" y1="160" x2="438" y2="160" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Pulse / Vitals Line at Bottom of Card -->
  <path d="M 120 255 L 200 255 L 215 240 L 230 270 L 245 230 L 260 265 L 275 255 L 480 255" fill="none" stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="245" cy="230" r="4.5" fill="#EC4899"/>

  <!-- Micro Badges -->
  <rect x="235" y="278" width="130" height="18" rx="9" fill="#F3E8FF"/>
  <text x="300" y="291" font-family="sans-serif" font-size="9" font-weight="600" fill="#7C3AED" text-anchor="middle">Fast Healthcare Dispatch</text>
</svg>
